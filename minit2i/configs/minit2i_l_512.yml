# BudgetPix on MiniT2I-L/16 at 512x512.
#   MINIT2I_ROOT=/path/to/minit2i-torch torchrun --nproc_per_node=4 train.py --config configs/minit2i_l_512.yml --resume
# Data: 24k steps on CC12M, then 16k on the 120K mix (mix120k_build.py).
image_size: 512
patch_size: 16                       # finest token (1024 tokens dense)
scales: [16, 32, 64]                 # token sizes; flat regions merge into 32- and 64-px tokens
thresholds: [6.0, 4.0]               # entropy (bits) below which a 32 / 64 px block merges
noise_scale: 2.0                     # MiniT2I's noise scale at 512
checkpoint: /path/to/minit2i-l-16        # released MiniT2I-L/16 (HF MiniT2I/MiniT2I: transformer/{config.json,*.safetensors})
llm: google/flan-t5-large            # frozen text encoder
prompt_length: 256
seed: 0

layout:                              # training layouts
  offset_lo: 0.0                     # per-image threshold offset ~ U(0, 2): about 25-100 % of the grid
  offset_hi: 2.0
  anchor_p: 0.15                     # share of images on the dense grid
  scramble_p: 0.10                   # share of layouts that ignore the content

data:
  local_dataset_dir: /path/to/mix120k/chunks_512         # chunk_*.pt (see data.py)
  micro_batch_size: 4                 # per GPU
  num_workers: 8

batch_size: 256                      # global: micro_batch_size x GPUs x grad_accum
grad_accum: 16                       # for 4 GPUs
blr: 1.0e-5                          # lr = blr * batch_size / 256
new_lr_mult: 8.0                     # the added modules learn 8x faster
warmup: 1000
ema: 0.9999
grad_clip: 3.0
max_steps: 40000
log_every: 50
save_every: 2000                     # checkpoint-last.pt (resumable)
snapshot_every: 4000
output_dir: runs/minit2i_l_512
